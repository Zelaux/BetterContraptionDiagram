[workspace]
resolver = "3"
[package]
name = "bcd_sable_ext"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
rapier3d = { git = "https://github.com/ryanhcode/rapier", rev = "38e92f117590862481a53df6fc69a5d893e29186", features = [
    "simd-nightly", # ВНИМАНИЕ: Требует nightly компилятор Rust
    "parallel",
] }

glam = "=0.24.2"
glamx = "=0.1.3"
nalgebra = "0.32.6"

dashmap = "6.0.1" 
hashbrown = "0.14.5"

jni = "0.21.1"

rayon = "1.10.0"
log = "0.4.22"
colored = "2.1.0"
fern = { version = "0.6.2", features = ["colored"] }
humantime = "2.1.0"

[profile.release]
lto = "thin"
codegen-units = 1

